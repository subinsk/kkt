# Render.com blueprint — free tier.
#
# Render rather than Vercel, and this is not a preference. KKT cannot run on
# serverless at all:
#
#   - The game store is in-memory (lib/game/store.ts). Every serverless
#     invocation is a fresh process, so the room would vanish between requests.
#   - /api/room/[code]/events holds an SSE stream open for the whole round.
#     Serverless functions are billed and capped by duration.
#   - The running agent id lives in a module-level Map.
#
# So it needs ONE long-lived Node process. That is what a Render web service is.
#
# Caveat that matters on the day: the free tier spins down after ~15 minutes of
# inactivity and takes 30–60s to wake. Hit the URL once before the demo.
services:
  - type: web
    name: kaun-katega-taarpati
    runtime: node
    plan: free
    region: singapore # closest to India — matters for RTC signalling latency
    # render:audio runs here because public/audio/ is gitignored — the clips
    # are regenerated from SARVAM_API_KEY at build time instead of committed.
    buildCommand: npm ci && npm run render:audio && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"

      # PUBLIC_BASE_URL is deliberately NOT listed.
      #
      # Render sets RENDER_EXTERNAL_URL to this service's own https URL, at both
      # build and run time, and resolvePublicBase() in lib/env.ts falls back to
      # it. So the deploy-then-set-the-URL-then-redeploy step is gone, along
      # with the silent failure it caused: Agora fetches /api/llm from this
      # origin and Vobiz fetches the answer_url, and a wrong value is dead air
      # rather than an error.
      #
      # Add PUBLIC_BASE_URL in the dashboard ONLY to override — a custom domain,
      # or pointing this service at a cloudflared tunnel during a rehearsal. It
      # takes precedence when set.

      - key: NEXT_PUBLIC_AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: AGORA_CUSTOMER_ID
        sync: false
      - key: AGORA_CUSTOMER_SECRET
        sync: false

      - key: SARVAM_API_KEY
        sync: false

      - key: LLM_PROVIDER
        value: groq
      - key: LLM_UPSTREAM_URL
        value: https://api.groq.com/openai/v1/chat/completions
      # Must match the default in lib/llm.ts, which is where the reasoning
      # lives: the host does not merely talk, it has to decide to call
      # cut_wire, and the gpt-oss family does not do parallel tool calls
      # (AGENTS.md). A brain that chats instead of acting is indistinguishable
      # on stage from a broken wire panel — the contestant answers correctly,
      # the host agrees out loud, and nothing is cut.
      #
      # This value overrides that default, so it is not decoration. It was
      # openai/gpt-oss-120b, which is exactly the model the code was moved off.
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_REASONING_EFFORT
        value: low
      - key: LLM_MAX_TOKENS
        value: "1024"
      - key: LLM_API_KEY
        sync: false

      - key: VOBIZ_AUTH_ID
        sync: false
      - key: VOBIZ_AUTH_TOKEN
        sync: false
      - key: VOBIZ_FROM_NUMBER
        sync: false
      - key: FALLBACK_FRIEND_NUMBER
        sync: false

      - key: SARVAM_TTS_SPEAKER
        value: abhilash
      - key: SARVAM_TTS_LANGUAGE
        value: hi-IN
      - key: SARVAM_ASR_LANGUAGE
        value: unknown
      - key: NEXT_PUBLIC_AUDIO_MODE
        value: "A"
